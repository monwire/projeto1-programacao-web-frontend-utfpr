<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/index.css" />
    <title>EcoWatt</title>
  </head>
  <body class="pagina-recuperacao">
    <header>
      <div id="logo">
        <img src="../assets/icons/logo.svg" alt="Logo EcoWatt" />EcoWatt
      </div>
      <div id="navContainer">
        <nav>
          <a href="login.html">Início</a>
          <a href="sobre.html">Sobre</a>
          <a href="login.html">Dicas</a>
          <a href="login.html">Contato</a>
        </nav>

        <a href="login.html" id="botaoEntrar" class="botao-verde">Entrar</a>
      </div>
    </header>

    <div id="loginContainer" class="radial-05">
      <div id="tituloContainer">
        <h1>Recuperar senha</h1>
        <h2>Digite seu e-mail para recuperar senha</h2>
      </div>

      <form id="recuperarSenhaForm">
        <label for="emailRecuperacao">E-mail:</label>
        <input
          type="email"
          name="emailRecuperacao"
          id="emailRecuperacao"
          placeholder="Digite o e-mail"
          class="radial-05"
        />
      </form>

      <div id="recuperarSenhaBtn">
        <a href="index.html" id="botaoRecuperar" class="botao-verde"
          >Recuperar senha</a
        >
        <a href="login.html" id="voltarBtn">Voltar</a>
      </div>

      <span class="direcionar-cadastro"
        >Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></span
      >
    </div>
  </body>
</html>
