<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/index.css" />
    <title>EcoWatt</title>
  </head>
  <body class="pagina-cadastro">
    <header>
      <div id="logo">
        <img src="assets/icons/logo.svg" alt="Logo EcoWatt" />EcoWatt
      </div>
      <div id="navContainer">
        <nav>
          <a href="pages/login.html">Início</a>
          <a href="pages/login.html">Sobre</a>
          <a href="pages/login.html">Dicas</a>
          <a href="pages/login.html">Contato</a>
        </nav>

        <a href="pages/login.html" id="botaoEntrar" class="botao-verde"
          >Entrar</a
        >
      </div>
    </header>

    <div id="formContainer" class="radial-05 sombra">
      <div id="formView" class="radial-05">
        <form>
          <h1>Cadastro</h1>
          <h2>
            Economize energia e ajude a construir um futuro mais sustentável
          </h2>
          <div class="campo-formulario radial-05">
            <img src="assets/icons/person-outline.svg" alt="ícone de pessoa" />
            <input
              type="text"
              name="nome"
              id="nome"
              placeholder="Nome Completo"
              required
            />
          </div>
          <div class="campo-formulario radial-05">
            <img src="assets/icons/mail-outline.svg" alt="ícone de e-mail" />
            <input
              type="email"
              name="email"
              id="email"
              placeholder="E-mail"
              required
            />
          </div>
          <div class="campo-formulario radial-05">
            <img src="assets/icons/call-outline.svg" alt="ícone de telefone" />
            <input
              type="tel"
              name="telefone"
              id="telefone"
              placeholder="Telefone"
              required
            />
          </div>
          <div class="campo-formulario radial-05">
            <img
              src="assets/icons/location-outline.svg"
              alt="ícone de localização de GPS"
            />
            <input
              type="text"
              name="endereco"
              id="endereco"
              placeholder="Endereço"
              required
            />
          </div>

          <div class="campo-formulario radial-05">
            <img
              src="assets/icons/eye-outline.svg"
              alt="ícone de visualização de senha"
            />
            <input
              type="password"
              name="senha"
              id="senha"
              placeholder="Senha"
              required
            />
          </div>
          <div id="botoesCadastroContainer">
            <a href="pages/login.html" class="botao-verde" id="botaoCadastrar"
              >Cadastrar</a
            >
            <span
              >Já tem uma conta? <a href="pages/login.html">Faça login</a></span
            >
          </div>
        </form>
        <img
          src="assets/figs/casa-energia-solar.jpg"
          alt="casa com placa solhar no telhado"
          id="formViewImg"
        />
      </div>
    </div>
  </body>
</html>
